name: Rust

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "rustfmt.toml"
      - "crates/**"
      - "examples/**"
      - "tests/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "rustfmt.toml"
      - "crates/**"
      - "examples/**"
      - "tests/**"

env:
  CARGO_TERM_COLOR: always
  CI_LOG_ROOT: ci-logs

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Prepare log directories
      run: mkdir -p "${CI_LOG_ROOT}/build"

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        cargo build --release --verbose 2>&1 | tee "${CI_LOG_ROOT}/build/cargo-build.log"

    - name: Run tests
      shell: bash
      run: |
        set -euo pipefail
        cargo test --verbose 2>&1 | tee "${CI_LOG_ROOT}/build/cargo-test.log"

    - name: Upload Linux build logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: linux-build-logs
        path: |
          ci-logs/build
        if-no-files-found: warn

  nist-module:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        module:
          - CM
          - DB
          - EX
          - IC
          - IF
          - IX
          - NC
          - OB
          - RL
          - RW
          - SG
          - SM
          - SQ
          - ST

    steps:
    - uses: actions/checkout@v6

    - name: Prepare log directories
      run: mkdir -p "${CI_LOG_ROOT}/nist-${{ matrix.module }}"

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build release
      shell: bash
      run: |
        set -euo pipefail
        cargo build --release 2>&1 | tee "${CI_LOG_ROOT}/nist-${{ matrix.module }}/cargo-build-release.log"

    - name: Extract NIST test suite
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p target/nist/source
        tar -xzf tests/nist/newcob.val.tar.gz -C target/nist/source/ 2>&1 | tee "${CI_LOG_ROOT}/nist-${{ matrix.module }}/extract-nist.log"

    - name: Prepare NIST programs
      shell: bash
      run: |
        set -euo pipefail
        make nist-prepare NIST_SOURCE_VAL=target/nist/source/newcob.val 2>&1 | tee "${CI_LOG_ROOT}/nist-${{ matrix.module }}/make-nist-prepare.log"

    - name: Run NIST CCVS 85 module
      shell: bash
      run: |
        set -euo pipefail
        make nist-run MODULE=${{ matrix.module }} NIST_JOBS=1 2>&1 | tee "${CI_LOG_ROOT}/nist-${{ matrix.module }}/make-nist-run.log"

    - name: Verify NIST CCVS 85 module pass rate
      shell: bash
      run: |
        set -euo pipefail
        summary=$(make nist-summary 2>&1)
        echo "$summary"
        printf '%s\n' "$summary" | tee "${CI_LOG_ROOT}/nist-${{ matrix.module }}/make-nist-summary.log"
        module_line=$(echo "$summary" | grep '^${{ matrix.module }}')
        total=$(echo "$module_line" | awk '{print $2}')
        pass=$(echo "$module_line" | awk '{print $3}')
        fail=$(echo "$module_line" | awk '{print $4}')
        ready=$(echo "$module_line" | awk '{print $5}')
        cerr=$(echo "$module_line" | awk '{print $6}')
        rerr=$(echo "$module_line" | awk '{print $7}')
        if [ "$pass" -ne "$total" ] || [ "$fail" -ne 0 ] || [ "$ready" -ne 0 ] || [ "$cerr" -ne 0 ] || [ "$rerr" -ne 0 ]; then
          echo "::error::NIST CCVS 85 ${{ matrix.module }} regression: $pass/$total PASS, $fail FAIL, $ready Ready, $cerr CErr, $rerr RErr"
          exit 1
        fi

    - name: Upload Linux NIST module logs and results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: linux-nist-${{ matrix.module }}-logs-and-results
        path: |
          ci-logs/nist-${{ matrix.module }}
          target/nist/results/${{ matrix.module }}
        if-no-files-found: warn
