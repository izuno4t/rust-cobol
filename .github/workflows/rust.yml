name: Rust

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "rustfmt.toml"
      - "crates/**"
      - "examples/**"
      - "tests/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "rustfmt.toml"
      - "crates/**"
      - "examples/**"
      - "tests/**"

env:
  CARGO_TERM_COLOR: always
  CI_LOG_ROOT: ci-logs

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Prepare log directories
      run: mkdir -p "${CI_LOG_ROOT}/build"

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        cargo build --release --verbose 2>&1 | tee "${CI_LOG_ROOT}/build/cargo-build.log"

    - name: Run tests
      shell: bash
      run: |
        set -euo pipefail
        cargo test --verbose 2>&1 | tee "${CI_LOG_ROOT}/build/cargo-test.log"

    - name: Upload Linux build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-build-logs
        path: |
          ci-logs/build
        if-no-files-found: warn

  nist:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ false }}

    steps:
    - uses: actions/checkout@v6

    - name: Prepare log directories
      run: mkdir -p "${CI_LOG_ROOT}/nist"

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build release
      shell: bash
      run: |
        set -euo pipefail
        cargo build --release 2>&1 | tee "${CI_LOG_ROOT}/nist/cargo-build-release.log"

    - name: Extract NIST test suite
      shell: bash
      run: |
        set -euo pipefail
        tar -xzf tests/nist/newcob.val.tar.gz -C tests/nist/ 2>&1 | tee "${CI_LOG_ROOT}/nist/extract-nist.log"

    - name: Prepare NIST programs
      shell: bash
      run: |
        set -euo pipefail
        make nist-prepare 2>&1 | tee "${CI_LOG_ROOT}/nist/make-nist-prepare.log"

    - name: Run NIST CCVS 85
      shell: bash
      run: |
        set -euo pipefail
        make nist-run 2>&1 | tee "${CI_LOG_ROOT}/nist/make-nist-run.log"

    - name: Verify 100% pass rate
      shell: bash
      run: |
        set -euo pipefail
        summary=$(make nist-summary 2>&1)
        echo "$summary"
        printf '%s\n' "$summary" | tee "${CI_LOG_ROOT}/nist/make-nist-summary.log"
        total_line=$(echo "$summary" | grep '^TOTAL')
        total=$(echo "$total_line" | awk '{print $2}')
        pass=$(echo "$total_line" | awk '{print $3}')
        fail=$(echo "$total_line" | awk '{print $4}')
        ready=$(echo "$total_line" | awk '{print $5}')
        cerr=$(echo "$total_line" | awk '{print $6}')
        rerr=$(echo "$total_line" | awk '{print $7}')
        if [ "$pass" -ne "$total" ] || [ "$fail" -ne 0 ] || [ "$ready" -ne 0 ] || [ "$cerr" -ne 0 ] || [ "$rerr" -ne 0 ]; then
          echo "::error::NIST CCVS 85 regression: $pass/$total PASS, $fail FAIL, $ready Ready, $cerr CErr, $rerr RErr"
          exit 1
        fi

    - name: Upload Linux NIST logs and results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-nist-logs-and-results
        path: |
          ci-logs/nist
          .nist/results
        if-no-files-found: warn

  nist-cm:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v6

    - name: Prepare log directories
      run: mkdir -p "${CI_LOG_ROOT}/nist-cm"

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build release
      shell: bash
      run: |
        set -euo pipefail
        cargo build --release 2>&1 | tee "${CI_LOG_ROOT}/nist-cm/cargo-build-release.log"

    - name: Extract NIST test suite
      shell: bash
      run: |
        set -euo pipefail
        tar -xzf tests/nist/newcob.val.tar.gz -C tests/nist/ 2>&1 | tee "${CI_LOG_ROOT}/nist-cm/extract-nist.log"

    - name: Prepare NIST programs
      shell: bash
      run: |
        set -euo pipefail
        make nist-prepare 2>&1 | tee "${CI_LOG_ROOT}/nist-cm/make-nist-prepare.log"

    - name: Run NIST CCVS 85 CM module
      shell: bash
      run: |
        set -euo pipefail
        make nist-run MODULE=CM 2>&1 | tee "${CI_LOG_ROOT}/nist-cm/make-nist-run-cm.log"

    - name: Verify NIST CCVS 85 CM pass rate
      shell: bash
      run: |
        set -euo pipefail
        summary=$(make nist-summary 2>&1)
        echo "$summary"
        printf '%s\n' "$summary" | tee "${CI_LOG_ROOT}/nist-cm/make-nist-summary.log"
        cm_line=$(echo "$summary" | grep '^CM')
        total=$(echo "$cm_line" | awk '{print $2}')
        pass=$(echo "$cm_line" | awk '{print $3}')
        fail=$(echo "$cm_line" | awk '{print $4}')
        ready=$(echo "$cm_line" | awk '{print $5}')
        cerr=$(echo "$cm_line" | awk '{print $6}')
        rerr=$(echo "$cm_line" | awk '{print $7}')
        if [ "$pass" -ne "$total" ] || [ "$fail" -ne 0 ] || [ "$ready" -ne 0 ] || [ "$cerr" -ne 0 ] || [ "$rerr" -ne 0 ]; then
          echo "::error::NIST CCVS 85 CM regression: $pass/$total PASS, $fail FAIL, $ready Ready, $cerr CErr, $rerr RErr"
          exit 1
        fi

    - name: Upload Linux NIST CM logs and results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-nist-cm-logs-and-results
        path: |
          ci-logs/nist-cm
          .nist/results/CM
        if-no-files-found: warn
